<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project: Find My Heart ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
:root{--ink:#48283c;--muted:#987487;--pink:#ec6596;--deep:#743a60;--line:#f2d7e2;--paper:#fffdfd}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 8%,#ffe0ec,transparent 35%),radial-gradient(ellipse at 90% 80%,#eee1ff,transparent 30%),#fff8fb;color:var(--ink);font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:min(720px,100%)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;color:#a25d7b;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.brand{font:600 21px 'Playfair Display',serif;letter-spacing:0;text-transform:none;color:var(--deep)}.brand span{color:var(--pink)}
.card{background:#ffffffdb;border:1px solid var(--line);box-shadow:0 22px 70px #8f426315;border-radius:26px;padding:clamp(23px,6vw,48px);text-align:center;backdrop-filter:blur(12px);min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#bf6388;font-weight:700}.bigheart{font-size:48px;filter:drop-shadow(0 7px 10px #ec659633);margin:9px 0 12px}.card h1{font:600 clamp(34px,7vw,54px)/1.08 'Playfair Display',serif;letter-spacing:-.03em;margin:8px 0 14px}.card h1 em{font-weight:500;color:#e15e91}.desc{max-width:490px;color:var(--muted);font-size:14px;line-height:1.85;margin:0 auto 20px}.btn{border:0;background:var(--deep);color:white;border-radius:13px;padding:13px 20px;font:700 13px 'DM Sans',sans-serif;cursor:pointer;transition:.18s;margin:5px}.btn:hover{background:#94517a;transform:translateY(-1px)}.btn.light{background:#ffedf4;color:#a3456c}.progress{height:5px;background:#f6e3eb;border-radius:9px;overflow:hidden;margin:0 0 22px}.bar{height:100%;width:0;background:linear-gradient(90deg,#f3a1bf,#d44f85);transition:width .3s}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:470px;margin:14px auto}.choice{padding:15px 12px;border:1px solid var(--line);background:#fff8fb;color:var(--ink);border-radius:13px;cursor:pointer;font:600 13px 'DM Sans',sans-serif}.choice:hover{border-color:#e891b0;background:#fff0f6}.feedback{min-height:25px;font-size:13px;color:#a54872;margin:12px 0}.heart-field{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px auto;max-width:420px}.heart{width:65px;height:65px;border:1px solid #f3cad9;border-radius:18px;background:#fff0f6;font-size:30px;cursor:pointer;transition:.15s}.heart:hover{transform:scale(1.08)}.heart.done{background:#f8d4e2;opacity:.6}.word-puzzle{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px 0}.word{padding:12px 14px;background:#fff0f6;border:1px solid #f2cad9;border-radius:11px;cursor:pointer;font-weight:700;color:#894568}.answer{min-height:48px;border:1px dashed #e8b5c9;border-radius:12px;padding:12px;max-width:480px;width:100%;color:#a45b7b;font-size:13px;margin:10px 0}.letter{font:italic 18px/1.8 'Playfair Display',serif;background:#fff5f9;border:1px solid var(--line);padding:22px;border-radius:16px;text-align:left;white-space:pre-line;max-width:510px;margin:8px auto 18px}.small{font-size:11px;color:#b18b9d;margin-top:22px}.hidden{display:none!important}.reveal-link{display:inline-block;background:linear-gradient(135deg,#ed6c9b,#ba4e84);color:white;text-decoration:none;border-radius:14px;padding:15px 23px;font-weight:700;box-shadow:0 9px 22px #d9528b30}.note{font-size:11px;color:#a88b9b;line-height:1.7;margin-top:14px}
@media(max-width:460px){.choices{grid-template-columns:1fr}.card{min-height:460px}.top{font-size:10px}.heart{width:57px;height:57px}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">love<span>♡</span>cade presents</div><div>SECRET MISSION 001</div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<section class="card" id="screen"></section>
<div class="small" style="text-align:center">A tiny adventure made with a very full heart ♡</div>
</div>
<script>
const screen=document.getElementById('screen'),bar=document.getElementById('bar');let hearts=0,chosen=[];
function render(html,step){screen.innerHTML=html;bar.style.width=(step/5*100)+'%'}
function start(){render(`<div class="kicker">classified: extremely cute</div><div class="bigheart">💌</div><h1>Hey, <em>my love.</em></h1><p class="desc">A tiny secret mission has arrived just for you. There are clues to find, a little puzzle to solve, and a surprise waiting at the end.<br><br><b>Your mission:</b> follow the hearts and unlock your secret gift.</p><button class="btn" onclick="level1()">Accept mission ♡</button><div class="note">No timer. No pressure. Just you, me, and a little mystery.</div>`,0)}
function level1(){render(`<div class="kicker">Level 01 · warm-up</div><div class="bigheart">💗</div><h1>Find the <em>real heart.</em></h1><p class="desc">One of these hearts holds the first clue. Trust your heart. (Okay, it's a little random.)</p><div class="heart-field" id="field"></div><div class="feedback" id="fb"></div>`,1);let f=document.getElementById('field');let lucky=Math.floor(Math.random()*6);for(let i=0;i<6;i++){let b=document.createElement('button');b.className='heart';b.textContent=['♡','💗','🌸','✨','💕','♡'][i];b.onclick=()=>{if(i===lucky){b.textContent='💌';b.classList.add('done');document.getElementById('fb').textContent='Clue found! You make ordinary things feel magical.';setTimeout(level2,900)}else{b.textContent='♡';document.getElementById('fb').textContent='Not this one, cutie. Try another heart!'}};f.appendChild(b)}}
function level2(){render(`<div class="kicker">Level 02 · the important question</div><div class="bigheart">🌷</div><h1>Choose your <em>favorite answer.</em></h1><p class="desc">What makes a little moment feel special?</p><div class="choices"><button class="choice" onclick="wrong(this)">✨ Expensive things</button><button class="choice" onclick="right2(this)">💗 Sharing it with someone you love</button><button class="choice" onclick="wrong(this)">🏆 Winning everything</button><button class="choice" onclick="wrong(this)">🌧️ A rainy spreadsheet</button></div><div class="feedback" id="fb"></div>`,2)}
function wrong(b){document.getElementById('fb').textContent='Hmm, try again. There is a softer answer hiding here. ♡'}
function right2(){document.getElementById('fb').textContent='Exactly. The little moments become big memories because of who we share them with. ♡';setTimeout(level3,1200)}
function level3(){chosen=[];let words=['YOU','ARE','MY','FAVORITE','PERSON'];let shuffled=['PERSON','MY','YOU','ARE','FAVORITE'].sort(()=>Math.random()-.5);render(`<div class="kicker">Level 03 · put the clue together</div><div class="bigheart">🧩</div><h1>Unscramble the <em>message.</em></h1><p class="desc">Tap the words in the right order to reveal the sentence.</p><div class="word-puzzle" id="words"></div><div class="answer" id="answer">Your secret sentence will appear here…</div><button class="btn light" onclick="resetWords()">Start over</button><button class="btn" onclick="checkWords()">Unlock clue →</button><div class="feedback" id="fb"></div>`,3);let box=document.getElementById('words');shuffled.forEach(w=>{let b=document.createElement('button');b.className='word';b.textContent=w;b.onclick=()=>{if(b.classList.contains('used'))return;b.classList.add('used');b.style.opacity='.35';chosen.push(w);document.getElementById('answer').textContent=chosen.join(' ') };box.appendChild(b)})}
function resetWords(){chosen=[];document.querySelectorAll('.word').forEach(b=>{b.classList.remove('used');b.style.opacity='1'});document.getElementById('answer').textContent='Your secret sentence will appear here…';document.getElementById('fb').textContent=''}
function checkWords(){if(chosen.join(' ')==='YOU ARE MY FAVORITE PERSON'){document.getElementById('fb').textContent='Correct. And I mean every word. 💗';setTimeout(level4,1100)}else document.getElementById('fb').textContent='Almost! Try: YOU ARE MY FAVORITE PERSON ♡'}
function level4(){render(`<div class="kicker">Level 04 · a tiny promise</div><div class="bigheart">🌙</div><h1>One last <em>little choice.</em></h1><p class="desc">If life were a game, what team would I want us to be on?</p><div class="choices"><button class="choice" onclick="wrong4()">⚔️ Opponents</button><button class="choice" onclick="wrong4()">🎲 Random teammates</button><button class="choice" onclick="right4()">💞 The same team, always</button><button class="choice" onclick="wrong4()">🚪 Different levels forever</button></div><div class="feedback" id="fb"></div>`,4)}
function wrong4(){document.getElementById('fb').textContent='Nope, sweetheart. Think of the person who is always rooting for you. ♡'}
function right4(){document.getElementById('fb').textContent='Always. Through every level, every plot twist, every version of tomorrow.';setTimeout(finalLevel,1200)}
function finalLevel(){render(`<div class="kicker">Mission complete · gift unlocked</div><div class="bigheart">💝</div><h1>You found <em>my heart.</em></h1><p class="desc">The real prize was never a score. It was getting to make you smile. I made a little world just for you, full of games, hearts, and a letter waiting to be opened.</p><div class="letter">To My Little Rizin,

Thank you for being you. I hope this little surprise makes you smile, even for a moment. Whenever the world feels loud, I hope you remember there is someone cheering for you, believing in you, and choosing you again and again.

Now, go explore your gift. ♡</div><a class="reveal-link" href="./lovecade.html">Open your surprise arcade ♡ ↗</a><div class="note">P.S. There is a letter waiting inside the arcade, too. Don't forget to open it. 💌</div>`,5)}
start();
</script></body></html>
